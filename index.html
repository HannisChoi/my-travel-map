<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的世界足跡</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        h1 { margin: 20px 0; color: #333; }
        #map { height: 600px; width: 90%; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stats { margin: 20px; font-size: 1.2rem; background: white; padding: 10px 20px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .info { color: #666; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>🌍 我的世界足跡</h1>
    <div class="stats">已探索國家：<span id="country-count">0</span></div>
    <div class="info">提示：點擊地圖上的國家來標記你的足跡</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 初始化地圖，中心點設在座標 [20, 0]，縮放等級 2
        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 儲存已去過的國家
        let visitedCountries = JSON.parse(localStorage.getItem('visitedCountries')) || [];

        // 更新統計數字
        function updateStats() {
            document.getElementById('country-count').innerText = visitedCountries.length;
        }

        // 載入世界地圖數據 (GeoJSON)
        fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            fillColor: visitedCountries.includes(feature.properties.name) ? '#ff6b6b' : '#abdbe3',
                            weight: 1,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function() {
                            const name = feature.properties.name;
                            if (visitedCountries.includes(name)) {
                                visitedCountries = visitedCountries.filter(c => c !== name);
                                layer.setStyle({ fillColor: '#abdbe3' });
                            } else {
                                visitedCountries.push(name);
                                layer.setStyle({ fillColor: '#ff6b6b' });
                            }
                            localStorage.setItem('visitedCountries', JSON.stringify(visitedCountries));
                            updateStats();
                        });
                        layer.bindPopup(feature.properties.name);
                    }
                }).addTo(map);
                updateStats();
            });
    </script>
</body>
</html>
